{% extends 'tienda/base.html' %}

{% block title %}TechGear - {{ accion }} Producto{% endblock %}

{% block content %}
<div style="max-width:500px; margin:0 auto; background:white; padding:30px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.08);">
    <h1 style="margin-top:0;">{{ accion }} Producto</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Nombre</label>
        <input type="text" name="nombre" required value="{{ producto.nombre|default:'' }}"
               style="width:100%; padding:8px; margin:6px 0 16px 0;">

        <label>Descripción</label>
        <textarea name="descripcion" rows="3"
                  style="width:100%; padding:8px; margin:6px 0 16px 0;">{{ producto.descripcion|default:'' }}</textarea>

        <label>Precio</label>
        <input type="number" step="0.01" min="0.01" name="precio" required value="{{ producto.precio|default:'' }}"
               style="width:100%; padding:8px; margin:6px 0 16px 0;">

        <label>Stock</label>
        <input type="number" min="0" name="stock" required value="{{ producto.stock|default:'' }}"
               style="width:100%; padding:8px; margin:6px 0 16px 0;">

        <label>Imagen</label><br>
        {% if producto.imagen %}
            <img src="{{ producto.imagen }}" alt="{{ producto.nombre }}" style="width:100px; height:100px; object-fit:cover; border-radius:8px; margin:8px 0; display:block;">
            <input type="hidden" name="imagen_actual" value="{{ producto.imagen }}">
            <small style="color:#6c757d;">Sube una nueva solo si quieres reemplazarla.</small>
        {% endif %}
        <input type="file" name="imagen" accept="image/*" style="width:100%; padding:8px; margin:6px 0 20px 0;">

        <div style="display:flex; justify-content:space-between;">
            <a href="{% url 'productos_admin' %}">Cancelar</a>
            <button type="submit" style="background:#d63384; color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:bold;">
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
